services:
  - type: web
    name: oracolo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: ORACOLO_AUTO_SCAN
        value: "1"
      - key: ORACOLO_SCAN_HOUR
        value: "22"
      - key: PYTHON_VERSION
        value: "3.12.4"
