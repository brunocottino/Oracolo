# Memoria permanente di Oracolo: ogni mese registra le decisioni (prova sui dati futuri) nel repository.
# Lo Space gratuito di Hugging Face ha il disco temporaneo; qui il registro resta per sempre.
name: Registro mensile Oracolo
on:
  schedule:
    - cron: "17 6 2 * *"     # il 2 di ogni mese, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Decisioni del mese
        run: python -m lab.oracolo_index > /dev/null
      - name: Salva il registro
        run: |
          git config user.name "Oracolo"
          git config user.email "actions@github.com"
          git add oracolo_forward.csv
          git diff --cached --quiet || (git commit -m "Registro Oracolo $(date +%Y-%m)" && git push)
