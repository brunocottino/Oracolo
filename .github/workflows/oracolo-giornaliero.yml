# Fotografia di Oracolo ogni giorno feriale, gratis su GitHub, senza Claude e senza PC acceso.
# Scrive OGGI.md (livelli 1-5, ipercomprati, forchette): si legge dal telefono su github.com.
name: Fotografia giornaliera Oracolo
on:
  schedule:
    - cron: "23 5 * * 1-5"     # lun-ven 05:23 UTC (6:23/7:23 in Italia)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracolo-giornaliero
  cancel-in-progress: false

jobs:
  fotografia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fotografia di oggi
        run: python aggiorna.py --oggi
      - name: Salva OGGI.md
        run: |
          git config user.name "Oracolo"
          git config user.email "actions@github.com"
          git add OGGI.md
          git diff --cached --quiet && exit 0
          git commit -m "Fotografia Oracolo $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
